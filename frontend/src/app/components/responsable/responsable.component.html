<div class="min-h-screen bg-gray-50 dark:bg-gray-900">

  <!-- Componente NavBar creado -->
  <app-nav-bar></app-nav-bar>

  <!-- Sidebar -->
  <aside class="fixed top-0 left-0 z-40 w-64 h-screen pt-14 transition-transform -translate-x-full bg-white border-r border-gray-200 md:translate-x-0 dark:bg-gray-800 dark:border-gray-700"
    aria-label="Sidenav" id="drawer-navigation">
    <div class="overflow-y-auto py-5 px-3 h-full bg-gray-300 dark:bg-gray-800">
      <!-- opciones de Responsable -->
      <ul class="space-y-2">
        <li>
          <a class="flex items-center p-2 text-base font-medium text-gray-700 rounded-lg dark:text-white group">
            <span class="ml-3 font-bold">RESPONSABLE</span>
          </a>
        </li>
        <li>
          <a routerLink="solicitudesPendientes"
             routerLinkActive="active"
             class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:border-2 hover:border-blue-500 dark:hover:border-blue-400 group">
            <svg
              class="w-6 h-6 text-gray-500 transition dark:text-gray-400 dark:group-hover:text-white"
              aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
              viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 4h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3m0 3h6m-3 5h3m-6 0h.01M12 16h3m-6 0h.01M10 3v4h4V3h-4Z"/>
            </svg>
            <span class="ml-3">Solicitudes pendientes</span>
          </a>
        </li>
        <li>
          <a routerLink="solicitudesAutorizadas"
             routerLinkActive="active"
             class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:border-2 hover:border-blue-500 dark:hover:border-blue-400 group">
            <svg
              class="w-6 h-6 text-gray-500 transition dark:text-gray-400 dark:group-hover:text-white"
              aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
              viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 4h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3m0 3h6m-3 5h3m-6 0h.01M12 16h3m-6 0h.01M10 3v4h4V3h-4Z"/>
            </svg>
            <span class="ml-3">Solicitudes autorizadas</span>
          </a>
        </li>
        <li>
          <a routerLink="solicitudesFinalizadas"
             routerLinkActive="active"
             class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:border-2 hover:border-blue-500 dark:hover:border-blue-400 group">
            <svg
              class="w-6 h-6 text-gray-500 transition dark:text-gray-400 dark:group-hover:text-white"
              aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
              viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 4h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3m0 3h6m-3 5h3m-6 0h.01M12 16h3m-6 0h.01M10 3v4h4V3h-4Z"/>
            </svg>
            <span class="ml-3">Solicitudes finalizadas</span>
          </a>
        </li>
        <li>
          <a routerLink="cambiarPass"
             routerLinkActive="active"
             class="flex items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:border-2 hover:border-blue-500 dark:hover:border-blue-400 group">
            <svg
              class="w-6 h-6 text-gray-500 transition dark:text-gray-400 dark:group-hover:text-white"
              aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
              viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"/>
            </svg>
            <span class="ml-3">Cambiar contraseña</span>
          </a>
        </li>
        <li>
          <button (click)="botonDescargarReporte()"
                  class="flex w-full items-center p-2 text-base font-medium text-gray-900 rounded-lg dark:text-white hover:border-2 hover:border-blue-500 dark:hover:border-blue-400 group transition-all cursor-pointer">
            <svg
              class="w-6 h-6 text-gray-500 transition dark:text-gray-400 dark:group-hover:text-white"
              aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
              viewBox="0 0 24 24">
              <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 15v2a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-2m-8 1V4m0 12-4-4m4 4 4-4"/>
            </svg>
            <span class="ml-3">Reporte del mes</span>
          </button>
        </li>

      </ul>
    </div>
  </aside>

  @if (!isVisible) {
    <main class="p-4 pt-20 md:ml-64">
      <div class="min-h-screen">
        <router-outlet></router-outlet>
      </div>
    </main>
  } @else {
    <div role="status">
      <svg aria-hidden="true" class="w-8 h-8 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
        <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
      </svg>
      <span class="sr-only">Procesando...</span>
    </div>
  }


</div>
