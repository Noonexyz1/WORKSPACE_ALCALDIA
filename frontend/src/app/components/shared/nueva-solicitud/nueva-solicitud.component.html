<form [formGroup]="solicitudForm" class="w-full max-w-4xl mx-auto">
  <div class="relative z-0 w-full mb-5 group">
        <span class="self-center text-4xl font-semibold whitespace-nowrap dark:text-white">
            Nueva solicitud
        </span>
  </div>

  <div class="grid gap-6">
    <div class="relative z-0 w-full mb-5 group">
      <input formControlName="cite" type="text" name="floating_first_name" id="citeID"
             class="block py-2.5 px-0 w-full text-lg text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
             placeholder=" " required/>
      <label for="citeID"
             class="peer-focus:font-medium absolute text-lg text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">
        CITE
      </label>
    </div>

    @if (!estadoNroDocumentos) {
      <div class="relative z-0 w-full mb-5 group flex items-center gap-2">
        <input formControlName="nroDeDocumento" type="number" name="floating_first_name" id="nroDocID"
               class="block py-2.5 px-2 w-full text-lg text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
               placeholder=" " required/>
        <label for="nroDocID"
               class="peer-focus:font-medium absolute text-lg text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">
          Ingrese cantidad de documentos a fontocopiar
        </label>
        <button (click)="botonSetNumeroDeCopias()"
                class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">
          Listo
        </button>
      </div>

    } @else {
      <div class="mt-6 flow-root sm:mt-8 border-gray-300 dark:border-gray-600 rounded-lg" style="padding: 10px;">
        <div class="divide-y divide-gray-200 dark:divide-gray-700">

          @for (item of listSolicitudToFor; track $index) {
            <div class="relative grid grid-cols-5 gap-4 py-6">
              <!-- Nombre del documento -->
              <div class="col-span-2">
                <div class="relative z-0 w-full mb-5 group">
                  <input formControlName="nombreRowDocumento" type="text" name="floating_first_name"
                         id="nombreDocID"
                         class="block py-2.5 px-0 w-full text-lg text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
                         placeholder=" " required/>
                  <label for="nombreDocID"
                         class="peer-focus:font-medium absolute text-lg text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">
                    Nombre del documento
                  </label>
                </div>
              </div>

              <!-- Nro. Pag. -->
              <div class="col-span-1 flex items-center justify-end">
                <div class="relative z-0 w-full mb-5 group">
                  <input formControlName="nroRowPaginas" type="number" name="floating_first_name"
                         id="nroPaginaID"
                         class="block py-2.5 px-0 w-full text-lg text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
                         placeholder=" " required/>
                  <label for="nroPaginaID"
                         class="peer-focus:font-medium absolute text-lg text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">
                    Nro. Pag.
                  </label>
                </div>
              </div>

              <!-- Cant. de copias -->
              <div class="col-span-1 flex items-center justify-end">
                <div class="relative z-0 w-full mb-5 group">
                  <input formControlName="nroRowCopias" type="number" name="floating_first_name"
                         id="cantCopiaID"
                         class="block py-2.5 px-0 w-full text-lg text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-white dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
                         placeholder=" " required/>
                  <label for="cantCopiaID"
                         class="peer-focus:font-medium absolute text-lg text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">
                    Cant. de copias
                  </label>
                </div>
              </div>

              <!-- Botón -->
              <div class="col-span-5 sm:col-span-1 sm:justify-self-end">
                <button (click)="botonDocumentoInsertado()"
                        class="w-full sm:w-auto rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm font-medium text-gray-900 hover:bg-gray-100 hover:text-primary-700 focus:z-10 focus:outline-none focus:ring-4 focus:ring-gray-100 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:focus:ring-gray-700">
                  Registrar
                </button>
              </div>
            </div>
          }

        </div>
      </div>

    }

    <div class="relative z-0 w-full mb-5 group">
      <button (click)="botonNuevaSolicitud()"
              class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-lg w-full sm:w-auto px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
        Enviar
      </button>
    </div>

  </div>
</form>
