<div class="flex flex-wrap items-center gap-y-4 py-6">
  <dl class="w-1/2 sm:w-1/4 lg:w-auto lg:flex-1">
    <dt class="text-base font-medium text-gray-500 dark:text-gray-400">ID Soli:</dt>
    <dd class="mt-1.5 text-base font-semibold text-gray-900 dark:text-white">
      <a href="#" class="hover:underline">{{ solicitud.id }}</a>
    </dd>
  </dl>

  <dl class="w-1/2 sm:w-1/4 lg:w-auto lg:flex-1">
    <dt class="text-base font-medium text-gray-500 dark:text-gray-400">CI:</dt>
    <dd class="mt-1.5 text-base font-semibold text-gray-900 dark:text-white">{{ solicitud.ci }}</dd>
  </dl>

  <dl class="w-1/2 sm:w-1/4 lg:w-auto lg:flex-1">
    <dt class="text-base font-medium text-gray-500 dark:text-gray-400">Cite:</dt>
    <dd class="mt-1.5 text-base font-semibold text-gray-900 dark:text-white">{{ solicitud.cite }}</dd>
  </dl>

  <dl class="w-1/2 sm:w-1/4 lg:w-auto lg:flex-1">
    <dt class="text-base font-medium text-gray-500 dark:text-gray-400">Fecha:</dt>
    <dd class="mt-1.5 text-base font-semibold text-gray-900 dark:text-white">{{ solicitud.fecha }}</dd>
  </dl>

  <dl class="w-1/2 sm:w-1/4 lg:w-auto lg:flex-1">
    <dt class="text-base font-medium text-gray-500 dark:text-gray-400">Descripcion:</dt>
    <dd class="mt-1.5 text-base font-semibold text-gray-900 dark:text-white">{{ solicitud.descripcion }}</dd>
  </dl>

  <dl class="w-1/2 sm:w-1/4 lg:w-auto lg:flex-1">
    <dt class="text-base font-medium text-gray-500 dark:text-gray-400">Cargo:</dt>
    <dd class="mt-1.5 text-base font-semibold text-gray-900 dark:text-white">{{ solicitud.cargo }}</dd>
  </dl>


  <div class="w-full grid sm:grid-cols-2 lg:flex lg:w-64 lg:items-center lg:justify-end gap-4">

    <!-- Modal toggle -->
    <button type="button" (click)="toggleModal()"
            class="block text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
      Ver documentos
    </button>

    @if (isModalVisible) {
      <!-- Main modal -->
      <div id="select-modal" tabindex="-1" aria-hidden="true"
           class="overflow-y-auto overflow-x-hidden fixed inset-0 z-50 flex justify-center items-center w-full h-full">
        <div class="relative p-4 w-full max-w-md max-h-full">
          <!-- Modal content -->
          <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
              <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                Documentos de solicitud
              </h3>
              <button type="button" (click)="toggleModal()"
                      class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm h-8 w-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                     viewBox="0 0 14 14">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                </svg>
                <span class="sr-only">Close modal</span>
              </button>
            </div>
            <!-- Modal body -->
            <div class="p-4 md:p-5">
              <p class="text-gray-500 dark:text-gray-400 mb-4">
                Selecciona los documentos que desea descargar:
              </p>
              <ul class="space-y-4 mb-4">
                <li>
                  <input type="radio" id="job-1" name="job" value="job-1" class="hidden peer" required/>
                  <label for="job-1"
                         (click)="botonSolicitudFotocopiaPDF()"
                         class="inline-flex items-center justify-between w-full p-5 text-gray-900 bg-white border border-gray-200 rounded-lg cursor-pointer dark:hover:text-gray-300 dark:border-gray-500 dark:peer-checked:text-blue-500 peer-checked:border-blue-600 peer-checked:text-blue-600 hover:text-gray-900 hover:bg-gray-100 dark:text-white dark:bg-gray-600 dark:hover:bg-gray-500">
                    <div class="block">
                      <div class="w-full text-lg font-semibold">Solicitud de fotocopia PDF</div>
                    </div>
                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true"
                         xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 15v2a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-2m-8 1V4m0 12-4-4m4 4 4-4"/>
                    </svg>
                  </label>
                </li>
                <li>
                  <input type="radio" id="job-2" name="job" value="job-2" class="hidden peer">
                  <label for="job-2"
                         (click)="botonOrdenFotocopiaPDF()"
                         class="inline-flex items-center justify-between w-full p-5 text-gray-900 bg-white border border-gray-200 rounded-lg cursor-pointer dark:hover:text-gray-300 dark:border-gray-500 dark:peer-checked:text-blue-500 peer-checked:border-blue-600 peer-checked:text-blue-600 hover:text-gray-900 hover:bg-gray-100 dark:text-white dark:bg-gray-600 dark:hover:bg-gray-500">
                    <div class="block">
                      <div class="w-full text-lg font-semibold">Orden de fotocopia PDF</div>
                    </div>
                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true"
                         xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 15v2a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-2m-8 1V4m0 12-4-4m4 4 4-4"/>
                    </svg>
                  </label>
                </li>
<!--                <li>-->
<!--                  <input type="radio" id="job-2" name="job" value="job-2" class="hidden peer">-->
<!--                  <label for="job-2"-->
<!--                         (click)="botonInformePDF()"-->
<!--                         class="inline-flex items-center justify-between w-full p-5 text-gray-900 bg-white border border-gray-200 rounded-lg cursor-pointer dark:hover:text-gray-300 dark:border-gray-500 dark:peer-checked:text-blue-500 peer-checked:border-blue-600 peer-checked:text-blue-600 hover:text-gray-900 hover:bg-gray-100 dark:text-white dark:bg-gray-600 dark:hover:bg-gray-500">-->
<!--                    <div class="block">-->
<!--                      <div class="w-full text-lg font-semibold">Informe PDF</div>-->
<!--                    </div>-->
<!--                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true"-->
<!--                         xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">-->
<!--                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"-->
<!--                            d="M4 15v2a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-2m-8 1V4m0 12-4-4m4 4 4-4"/>-->
<!--                    </svg>-->
<!--                  </label>-->
<!--                </li>-->
                <li>
                  <input type="radio" id="job-3" name="job" value="job-3" class="hidden peer">
                  <label for="job-3"
                         (click)="botonComunicacionInterna()"
                         class="inline-flex items-center justify-between w-full p-5 text-gray-900 bg-white border border-gray-200 rounded-lg cursor-pointer dark:hover:text-gray-300 dark:border-gray-500 dark:peer-checked:text-blue-500 peer-checked:border-blue-600 peer-checked:text-blue-600 hover:text-gray-900 hover:bg-gray-100 dark:text-white dark:bg-gray-600 dark:hover:bg-gray-500">
                    <div class="block">
                      <div class="w-full text-lg font-semibold">Comunicacion interna PDF</div>
                    </div>
                    <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true"
                         xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 15v2a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-2m-8 1V4m0 12-4-4m4 4 4-4"/>
                    </svg>
                  </label>
                </li>
              </ul>
            </div>

          </div>
        </div>
      </div>
    }

  </div>

</div>
