# Asegúrate de que Spring Boot esté escuchando en 0.0.0.0 (todas las interfaces de red)
# y no solo en localhost o 127.0.0.1.
# server.address=0.0.0.0

spring.application.name=prototipo
server.port=8081

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/prototipo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA y Hibernate
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
