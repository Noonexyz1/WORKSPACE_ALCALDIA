# Asegurate de que Spring Boot este escuchando en 0.0.0.0 (todas las interfaces de red)
# y no solo en localhost o 127.0.0.1.
# server.address=0.0.0.0

spring.application.name=prototipo
server.port=8081

# Configuracion de MySQL
spring.datasource.url=jdbc:mysql://${DB_SICOPI_HOST}/${DB_SICOPI_NAME}
spring.datasource.username=${DB_SICOPI_USER}
spring.datasource.password=${DB_SICOPI_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA y Hibernate
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

